[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-timetracker"
version = "0.1.0"
description = "Tempo-like time reports over Jira Data Center worklogs"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "pytest-asyncio>=0.23"]

[project.scripts]
jtt = "jtt.__main__:main"

[tool.setuptools.packages.find]
include = ["jtt*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
