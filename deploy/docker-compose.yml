# docker compose -f deploy/docker-compose.yml up -d --build
# Put the token into deploy/jira-pat.txt and the default team config into deploy/teams.json first.
services:
  jtt:
    build: ..
    image: jira-timetracker:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JTT_JIRA_URL: https://jira.example.com
      JTT_JIRA_PAT_FILE: /run/secrets/jira_pat
      JTT_TEAMS_FILE: /config/teams.json
      # JTT_SD_TRACK_FIELD_NAME: SD Track
      # JTT_HOURS_PER_PERSON_DAY: "8"
      # JTT_CA_BUNDLE: /config/corp-ca.pem
      # JTT_MAX_PARALLEL_REPORTS: "3"
      # JTT_REPORT_CACHE_SECONDS: "0"
      # Sign-in through Keycloak (docs/DEPLOY.md); put the client secret into deploy/oidc-client-secret.txt,
      # the session key into deploy/session-secret.txt, and uncomment both secrets below and under jtt.
      # JTT_PUBLIC_URL: https://timereports.example.com
      # JTT_OIDC_ISSUER: https://sso.example.com/realms/corp
      # JTT_OIDC_CLIENT_ID: jira-timetracker
      # JTT_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      # JTT_OIDC_ALLOWED_ROLES: jtt-user
      # JTT_SESSION_SECRET_FILE: /run/secrets/session_secret
    volumes:
      - ./teams.json:/config/teams.json:ro
    secrets:
      - jira_pat
      # - oidc_client_secret
      # - session_secret

secrets:
  jira_pat:
    file: ./jira-pat.txt
  # oidc_client_secret:
  #   file: ./oidc-client-secret.txt
  # session_secret:
  #   file: ./session-secret.txt
